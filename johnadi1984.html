<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Content Center · PARFI Jawa Timur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/private-admin.css">
  <style>
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3eadb;padding:24px}
    .login-card{width:min(100%,380px);padding:42px;background:#fffaf0;border:1px solid #e5d8c5;border-radius:18px;box-shadow:0 16px 45px #8d76521c}
    .login-card h1{font:600 2rem/1.1 'Plus Jakarta Sans',sans-serif;color:#5f574c;letter-spacing:0;margin:0 0 28px}
    .login-card label{color:#5f574c;font-size:.72rem}.login-card input{background:#fffdf8;border-color:#dfd1bd;border-radius:10px}
    .login-card .primary{background:#b89a72;color:#fffaf0;border-radius:10px}.login-card .primary:hover{background:#a9875f}.login-aside{display:none}
  </style>
</head>
<body>
  <main id="loginView" class="login-page">
    <section class="login-card">
      <h1>Login</h1>
      <form id="loginForm" novalidate>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit" id="loginButton">Login <span>→</span></button>
        <p id="loginMessage" class="message" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <main id="dashboardView" class="dashboard hidden">
    <aside class="sidebar">
      <a class="brand" href="/">PARFI <span>JAWA TIMUR</span></a>
      <p class="eyebrow">AI CONTENT CENTER</p>
      <nav aria-label="Menu private">
        <button class="nav-item" data-section="news">Berita</button>
        <button class="nav-item" data-section="film">Trailer</button>
        <button class="nav-item" data-section="agenda">Agenda</button>
      </nav>
      <div class="account"><span id="userEmail">Pengelola</span><button id="logoutButton" class="logout">Logout</button></div>
    </aside>
    <section class="content"><header><div><p class="eyebrow" id="sectionEyebrow">PRIVATE DASHBOARD</p><h2 id="sectionTitle">Selamat datang.</h2></div><a href="/" class="site-link">Lihat website ↗</a></header>
      <section id="workspacePanel" class="workspace-panel"></section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/private-admin.js"></script>
</body>
</html>
